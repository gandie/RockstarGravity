<!DOCTYPE html>
<html>
    <head>
        <script type="text/javascript" src="js/p5.min.js"></script>
        <script type="text/javascript" src="js/satriani.standalone.js"></script>
        <script type="text/javascript" src="js/constants.js"></script>
        <script type="text/javascript" src="js/calc_root.js"></script>
        <script type="text/javascript" src="js/newton_force.js"></script>
        <script type="text/javascript" src="js/gravity_main.js"></script>
        <script type="text/javascript" src="js/gravity.js"></script>
    </head>
<body>
    <div></div>
    <script type="text/javascript">
        let source = 'Shout "Hello World"';

        source = gravity_rockstar;

        let output = console.log;

        let initial_input = "500.0//500.0//0.0//0.0//1000.0,50.0//500.0//0.0//1.0//1.0,250.0//500.0//0.0//1.0//1.0";
        let input = () => initial_input;
        let rockstar = new Satriani.Interpreter(output);

        console.log(source);
        let sketch = function(p) {
            let x = 100;
            let y = 100;

            p.setup = function() {
                p.createCanvas(1000, 1000);
            };

            p.draw = function() {
                p.background(0);
                p.fill(255);
                initial_input = rockstar.run(source, input, output);
                let bodies = initial_input.split(",");
                for (const body of bodies) {
                    let attrs = body.split("//");
                    let body_size = 5;
                    if (parseInt(attrs[4], 10) > 100) {
                        body_size = 10;
                    }
                    p.rect(attrs[0], attrs[1], body_size, body_size);
                }
            };
        };

        let myp5 = new p5(sketch);

    </script>
</body>
</html>
